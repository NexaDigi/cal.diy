name: Nexa Cal.diy Docker Build

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag to publish
        required: true
        default: 20260808-b2c28a23

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/nexadigi/cal-diy:${{ inputs.image_tag }}
          build-args: |
            NEXT_PUBLIC_WEBAPP_URL=https://calendario.nexadigi.com.br
            NEXT_PUBLIC_API_V2_URL=https://calendario.nexadigi.com.br/api/v2
            CALCOM_TELEMETRY_DISABLED=1
            NEXTAUTH_SECRET=build-time-placeholder
            CALENDSO_ENCRYPTION_KEY=build-time-placeholder
            DATABASE_URL=postgresql://postgres:placeholder@postgres:5432/calcom
            NEXT_PUBLIC_SINGLE_ORG_SLUG=
            ORGANIZATIONS_ENABLED=
